plugins {
    id "com.gradleup.shadow" version "9.3.0"
    // Legacy com.matthewprenger.cursegradle used removed Gradle APIs; Modrinth/CurseForge publish on the root project.
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.9.0"
}
architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    //modCompileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    //modLocalRuntime "dev.emi:emi-neoforge:${emi_version}"
}

sourceSets.main.resources { srcDir '../common/src/main/generated/' }


processResources {
    def expandProps = [
            version                 : project.version,
            loader_version_range    : rootProject.findProperty("loader_version_range") ?: "[1,)",
            mod_license             : rootProject.findProperty("mod_license") ?: "",
            issues                  : rootProject.findProperty("issues") ?: "",
            homepage                : rootProject.findProperty("homepage") ?: "",
            mod_authors             : rootProject.findProperty("mod_authors") ?: "",
            mod_id                  : rootProject.findProperty("mod_id") ?: "",
            mod_version             : rootProject.findProperty("mod_version") ?: project.version,
            mod_name                : rootProject.findProperty("mod_name") ?: "",
            mod_description         : rootProject.findProperty("mod_description") ?: "",
            neo_version_range       : rootProject.findProperty("neo_version_range") ?: "",
            minecraft_version_range : rootProject.findProperty("minecraft_version_range") ?: "",
    ]
    expandProps.each { key, value -> inputs.property(key, value.toString()) }

    filesMatching("META-INF/neoforge.mods.toml") {
        expand expandProps
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

loom {
    accessWidenerPath = file("../common/src/main/resources/more_slabs_stairs_and_walls.accesswidener")
    neoForge {
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)

}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

tasks.withType(JavaCompile) {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly // see [http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html](http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html)
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release = 21
}

// --- Publish to Modrinth / CurseForge (root project only; uses :fabric:remapJar and :neoforge:remapJar)
def publishChangelog = rootProject.file("CHANGELOG.md").exists()
        ? rootProject.file("CHANGELOG.md").getText("UTF-8")
        : "No changelog was specified."

def neoforgeRemapJarTask = tasks.getByPath(":neoforge:remapJar")

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: findProperty("modrinth_token")
    projectId = findProperty("modrinth_id")?.toString()
    versionName = "v" + project.mod_version + "+" + project.minecraft_version + " NeoForge"
    versionNumber = project.mod_version + "+" + project.minecraft_version
    versionType = "release"
    uploadFile = neoforgeRemapJarTask
    detectLoaders = false
    gameVersions = [findProperty("minecraft_version")?.toString()]
    loaders = ["neoforge"]
    changelog = publishChangelog
}

curseforge {
    apiKey = "${System.getenv("CURSEFORGE_KEY")}"
    project {
        id = "${project.curseforge_id}"
        mainArtifact (neoforgeRemapJarTask){
            displayName = "v" + project.mod_version + "+" + project.minecraft_version  + " NeoForge"
        }
        changelogType = 'markdown'
        changelog = rootProject.file("CHANGELOG.md").text
        releaseType = 'release'
        addGameVersion "NeoForge"
        addGameVersion project.minecraft_version
    }
}

tasks.named("curseforge").configure {
    dependsOn neoforgeRemapJarTask
    group = "publishing"
}

tasks.named("modrinth").configure {
    dependsOn neoforgeRemapJarTask
    group = "publishing"
}
