plugins {
    id "com.gradleup.shadow" version "9.3.0"
    // Legacy com.matthewprenger.cursegradle used removed Gradle APIs; Modrinth/CurseForge publish on the root project.
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.9.0"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    //modApi "com.terraformersmc:modmenu:${project.project.mod_menu_version}"
    //modApi "me.shedaniel.cloth:cloth-config-fabric:${project.project.cloth_config_version}"

    //modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    //modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
        expand "minecraft_version": project.minecraft_version
    }
}

loom {
    accessWidenerPath = file("../common/src/main/resources/more_slabs_stairs_and_walls.accesswidener")
    runs {
        //
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
        //

        client {

        }

        datagenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("../common/src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    '../common/src/main/generated'
            ]
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

// --- Publish to Modrinth / CurseForge (root project only; uses :fabric:remapJar and :neoforge:remapJar)
def publishChangelog = rootProject.file("CHANGELOG.md").exists()
        ? rootProject.file("CHANGELOG.md").getText("UTF-8")
        : "No changelog was specified."

def fabricRemapJarTask = tasks.getByPath(":fabric:remapJar")

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: findProperty("modrinth_token")
    projectId = findProperty("modrinth_id")?.toString()
    versionName = "v" + project.mod_version + "+" + project.minecraft_version + " Fabric"
    versionNumber = project.mod_version + "+" + project.minecraft_version
    versionType = "release"
    uploadFile = fabricRemapJarTask
    detectLoaders = false
    gameVersions = [findProperty("minecraft_version")?.toString()]
    loaders = ["fabric", "quilt"]
    changelog = publishChangelog
}

curseforge {
    apiKey = "${System.getenv("CURSEFORGE_KEY")}"
    project {
        id = "${project.curseforge_id}"
        mainArtifact (fabricRemapJarTask){
            displayName = "v" + project.mod_version + "+" + project.minecraft_version  + " Fabric"
        }
        changelogType = 'markdown'
        changelog = rootProject.file("CHANGELOG.md").text
        releaseType = 'release'
        addGameVersion "Fabric"
        addGameVersion project.minecraft_version
    }
}

tasks.named("modrinth").configure {
    dependsOn fabricRemapJarTask
    group = "publishing"
}

tasks.named("curseforge").configure {
    dependsOn fabricRemapJarTask
    group = "publishing"
}


