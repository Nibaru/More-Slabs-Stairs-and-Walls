plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.13.467" apply false
    // 1.2.30+ requires JVM 25; stay on 1.1.x for Java 21 (Minecraft mod toolchain).
    id "net.darkhax.curseforgegradle" version "1.1.28"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
    }

    tasks.withType(JavaCompile) {

        options.encoding = "UTF-8"
        options.release.set(21)
    }

    java {
        withSourcesJar()
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

        var replaceProperties = [
                minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                neo_version         : neo_version, neo_version_range: neo_version_range,
                loader_version_range: loader_version_range,
                mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                mod_authors         : mod_authors, mod_description: mod_description,
                fabric_loader_version: fabric_loader_version,
                sources : sources,
                homepage: homepage,
                issues  : issues,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
            expand replaceProperties + [project: project]
        }
    }
}

// --- Publish to Modrinth / CurseForge (root project only; uses :fabric:remapJar and :neoforge:remapJar)
def publishChangelog = rootProject.file("CHANGELOG.md").exists()
        ? rootProject.file("CHANGELOG.md").getText("UTF-8")
        : "No changelog was specified."

def fabricRemapJarTask = tasks.getByPath(":fabric:remapJar")
def neoforgeRemapJarTask = tasks.getByPath(":neoforge:remapJar")

tasks.register("publishCurseForge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "publishing"
    description = "Upload Fabric (primary) and NeoForge (additional) jars to CurseForge"
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: findProperty("curseforge_token")
    disableVersionDetection()

    def curseProjectId = findProperty("curseforge_id")?.toString()
    def mcVersion = findProperty("minecraft_version")?.toString()

    def mainFile = upload(curseProjectId, fabricRemapJarTask)
    mainFile.releaseType = "release"
    mainFile.changelog = publishChangelog
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion(mcVersion)
    // Mod loaders are game-version tags; sub-files inherit parent versions (cannot set per-child).
    mainFile.addModLoader("Fabric")
    mainFile.addModLoader("NeoForge")

    mainFile.withAdditionalFile(neoforgeRemapJarTask)

    dependsOn fabricRemapJarTask, neoforgeRemapJarTask
}

tasks.register("publishPlatforms") {
    group = "publishing"
    description = "Runs modrinth and publishCurseForge"
    dependsOn tasks.named("modrinth"), tasks.named("publishCurseForge")
}

